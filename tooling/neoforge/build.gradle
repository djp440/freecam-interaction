plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = '0.1.0'
group = 'local.freecaminteraction'
base.archivesName = 'freecam_interaction'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main {
    java.setSrcDirs(['../../src/main/java'])
    resources.setSrcDirs(['../../src/main/resources'])
}
neoForge {
    version = '21.1.249'
    runs {
        client {
            client()
            gameDirectory = project.file('../../run/client')
        }
    }
    mods { freecam_interaction { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_id: 'freecam_interaction', mod_name: '自由视角交互', mod_version: '0.1.0',
               minecraft_version: '1.21.1', neo_version: '21.1.249')
    }
}
tasks.register('interactionCheck', JavaExec) {
    dependsOn tasks.named('classes')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = '../../scripts/InteractionCheck.java'
    jvmArgs '-ea', '-Dfile.encoding=UTF-8'
}
